<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL 编解码 · WebTools</title>
  <meta name="description" content="免费在线 URL 编解码：encodeURI/Component、Query 参数解析与回拼、URL 结构拆解，全本地运行。" />
  <script>try{var _t=localStorage.getItem('webtools.theme');if(_t==='dark'||(!_t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(_e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/common.css?v=20260908d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">🧰 Web<span>Tools</span></a>
      <div class="nav-wrap">
      <nav class="nav">
        <a href="../index.html">首页</a>
        <a href="./json-formatter.html">JSON</a>
        <a href="./base64.html">Base64</a>
        <a href="./timestamp.html">时间戳</a>
        <a href="./url-codec.html" class="active">URL</a>
        <a href="./regex.html">正则</a>
        <a href="./jwt.html">JWT</a>
        <a href="./text-diff.html">对比</a>
        <a href="./password.html">密码</a>
        <a href="./markdown.html">MD</a>
        <a href="./image-compress.html">图片</a>
      </nav>
        <button class="icon-btn theme-btn" id="theme-toggle" title="切换深色 / 浅色" aria-label="切换深色模式">
          <svg class="ic icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="ic icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <div class="title-row">
        <span class="title-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </span>
        <h1>URL 编解码 / Query 解析</h1>
        <span class="badge-secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          全本地解析，不上传服务器
        </span>
      </div>
      <p>encodeURI ⇄ encodeURIComponent、Query 表格化编辑、URL 结构拆解。</p>
    </div>

    <div class="toolbar" role="toolbar" aria-label="URL 操作">
      <div class="tb-group" role="group" aria-label="核心动作">
        <button class="btn primary" id="btn-encode">编码
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        </button>
        <button class="btn primary" id="btn-decode">解码
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="tb-divider" aria-hidden="true"></div>
      <div class="tb-group" role="group" aria-label="转换选项">
        <label class="indent-label" for="sel-mode">模式
          <select id="sel-mode">
            <option value="component" selected>encodeURIComponent（推荐，编码更彻底）</option>
            <option value="uri">encodeURI（保留 : / ? # & = 等）</option>
          </select>
        </label>
        <label class="indent-label"><input type="checkbox" id="chk-live" checked /> 实时转换</label>
      </div>
      <span class="spacer"></span>
      <div class="tb-group" role="group" aria-label="辅助动作">
        <button class="btn ghost" id="btn-sample">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
          示例
        </button>
        <button class="btn ghost" id="btn-swap">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
          互换
        </button>
        <button class="btn ghost danger" id="btn-clear">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空
        </button>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="workarea">
      <section class="pane">
        <div class="pane-header"><span class="pane-title">原文</span>
          <span class="actions"><button class="btn small" id="btn-copy-raw">复制</button></span>
        </div>
        <textarea id="ta-raw" class="tall" placeholder="输入原文，如：https://example.com/搜索?q=你好&lang=zh#锚点" spellcheck="false"></textarea>
      </section>
      <section class="pane">
        <div class="pane-header"><span class="pane-title">编码后</span>
          <span class="actions"><button class="btn small" id="btn-copy-enc">复制</button></span>
        </div>
        <textarea id="ta-enc" class="tall" placeholder="编码结果在这里；也可粘贴编码串点「解码」" spellcheck="false"></textarea>
      </section>
    </div>

    <div class="statusbar">
      <span class="st-item">原文&nbsp;<b id="st-raw">0</b>&nbsp;字符</span>
      <span class="st-item">编码后&nbsp;<b id="st-enc">0</b>&nbsp;字符</span>
      <span class="st-item">状态&nbsp;<b id="st-status">待处理</b></span>
    </div>

    <section class="pane" style="margin-bottom:12px">
        <div class="pane-header"><span class="pane-title">Query 参数解析 / 编辑</span>
        <span class="actions">
          <button class="btn small" id="btn-parse">从原文解析</button>
          <button class="btn small primary" id="btn-build">用下表重新拼回 URL</button>
        </span>
      </div>
      <div style="padding:12px">
        <table class="kv-table" id="kv-table">
          <thead><tr><th style="width:32%">key</th><th>value</th><th style="width:64px">操作</th></tr></thead>
          <tbody id="kv-body"></tbody>
        </table>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn small" id="btn-add-row">+ 添加参数</button>
        </div>
      </div>
    </section>

    <section class="pane" style="margin-bottom:40px">
        <div class="pane-header"><span class="pane-title">URL 结构拆解</span>
        <span class="actions"><button class="btn small" id="btn-split">拆解原文</button></span>
      </div>
      <div id="url-parts" class="result-box" style="margin:12px">点「拆解原文」查看 protocol / host / path / query / hash…</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><a href="../index.html">← 返回工具箱首页</a> · WebTools · 全本地运行</div>
  </footer>

  <script>
    (function(){var tg=document.getElementById('theme-toggle');if(tg)tg.addEventListener('click',function(){var d=document.documentElement;var dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;try{localStorage.setItem('webtools.theme',dark?'dark':'light');}catch(e){}})})();
  </script>
  <script src="../assets/js/url-codec.js"></script>
</body>
</html>
