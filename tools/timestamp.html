<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间戳转换 · WebTools</title>
  <meta name="description" content="免费在线 Unix 时间戳转换：时间戳 ⇄ 日期、毫秒/秒自适应、常用时区、ISO/UTC/本地格式，全本地运行。" />
  <script>try{var _t=localStorage.getItem('webtools.theme');if(_t==='dark'||(!_t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(_e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/common.css?v=20260925a" />
  <link rel="stylesheet" href="../assets/css/nav.css?v=20260925a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>" />
</head>
<body>
    <!-- ============ 顶部导航（site-nav.js 渲染） ============ -->
  <div id="site-nav"></div>
  <script src="../assets/js/site-nav.js?v=20260925a"></script>

  <main class="container">
    <div class="page-title">
      <div class="title-row">
        <span class="title-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <h1>时间戳转换</h1>
        <span class="badge-secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          全本地解析，不上传服务器
        </span>
      </div>
      <p>Unix 时间戳 ⇄ 日期字符串，秒 / 毫秒自适应，支持常用时区切换。</p>
    </div>

    <section class="pane" style="margin:12px 0">
      <div class="pane-header"><span class="pane-title">现在<em class="pane-sub">每秒刷新</em></span>
        <span class="actions"><button class="btn small" id="btn-now">用当前时间填充</button></span>
      </div>
      <div class="now-grid">
        <div><div class="k">秒级时间戳</div><div class="v" id="now-s">-</div></div>
        <div><div class="k">毫秒级时间戳</div><div class="v" id="now-ms">-</div></div>
        <div><div class="k">本地时间</div><div class="v" id="now-local">-</div></div>
        <div><div class="k">UTC</div><div class="v" id="now-utc">-</div></div>
      </div>
    </section>

    <div class="toolbar" role="toolbar" aria-label="时间戳操作">
      <div class="tb-group" role="group" aria-label="格式设置">
        <label class="indent-label" for="sel-tz">时区
          <select id="sel-tz">
          <option value="local" selected>本地时区</option>
          <option value="UTC">UTC</option>
          <option value="Asia/Shanghai">Asia/Shanghai（北京时间）</option>
          <option value="Asia/Tokyo">Asia/Tokyo</option>
          <option value="Europe/London">Europe/London</option>
          <option value="Europe/Paris">Europe/Paris</option>
          <option value="America/New_York">America/New_York</option>
          <option value="America/Los_Angeles">America/Los_Angeles</option>
        </select>
      </label>
      </div>
      <span class="spacer"></span>
      <div class="tb-group" role="group" aria-label="辅助动作">
        <button class="btn ghost" id="btn-sample">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
          示例
        </button>
        <button class="btn ghost danger" id="btn-clear">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空
        </button>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="workarea">
      <section class="pane">
        <div class="pane-header"><span class="pane-title">时间戳 → 日期</span>
          <span class="actions"><button class="btn small primary" id="btn-t2d">转换 →</button></span>
        </div>
        <div style="padding:12px;display:flex;flex-direction:column;gap:8px">
          <input id="in-ts" class="field" inputmode="numeric" placeholder="输入时间戳，如 1757200000 或 1757200000000" />
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn small" data-ts="now-s">当前（秒）</button>
            <button class="btn small" data-ts="now-ms">当前（毫秒）</button>
            <button class="btn small" data-ts="day">今天 00:00</button>
          </div>
          <div id="out-date" class="result-box">转换结果显示在这里…</div>
        </div>
      </section>

      <section class="pane">
        <div class="pane-header"><span class="pane-title">日期 → 时间戳</span>
          <span class="actions"><button class="btn small primary" id="btn-d2t">← 转换</button></span>
        </div>
        <div style="padding:12px;display:flex;flex-direction:column;gap:8px">
          <input id="in-date" class="field" placeholder="输入日期，如 2026-09-07 12:00:00 或 ISO 格式" />
          <label style="font-size:13px;color:var(--muted)">或用选择器 <input type="datetime-local" id="in-picker" class="field" style="margin-top:4px" /></label>
          <div id="out-ts" class="result-box">转换结果显示在这里…</div>
        </div>
      </section>
    </div>

    <p class="page-note">
      说明：10 位数字按秒、13 位按毫秒解析；其他长度按数量级自动换算。日期解析支持
      <code>YYYY-MM-DD HH:mm:ss</code>、<code>ISO8601</code>、<code>MM/DD/YYYY</code> 等常见格式，解析失败会明确报错。
    </p>
  </main>

  <footer class="site-footer">
    <div class="container"><a href="../index.html">← 返回工具箱首页</a> · WebTools · 全本地运行</div>
  </footer>

  <script>
    (function(){var tg=document.getElementById('theme-toggle');if(tg)tg.addEventListener('click',function(){var d=document.documentElement;var dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;try{localStorage.setItem('webtools.theme',dark?'dark':'light');}catch(e){}})})();
  </script>
  <script src="../assets/js/timestamp.js"></script>
</body>
</html>
