<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正则测试 · WebTools</title>
  <meta name="description" content="免费在线正则表达式测试：实时匹配高亮、分组明细、替换预览、常用模式速查，全本地运行。" />
  <script>try{var _t=localStorage.getItem('webtools.theme');if(_t==='dark'||(!_t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(_e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/common.css?v=20260925a" />
  <link rel="stylesheet" href="../assets/css/nav.css?v=20260925a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
</head>
<body>
    <!-- ============ 顶部导航（site-nav.js 渲染） ============ -->
  <div id="site-nav"></div>
  <script src="../assets/js/site-nav.js?v=20260925a"></script>

  <main class="container">
    <div class="page-title">
      <div class="title-row">
        <span class="title-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v12"/><path d="M17.2 9 6.8 15"/><path d="m6.8 9 10.4 6"/></svg>
        </span>
        <h1>正则表达式测试</h1>
        <span class="badge-secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          全本地解析，不上传服务器
        </span>
      </div>
      <p>JS 语法实时匹配、高亮、分组明细、替换预览，附常用模式速查。</p>
    </div>

    <section class="pane" style="margin:12px 0">
      <div class="pane-header"><span class="pane-title">正则表达式</span>
        <span class="actions"><button class="btn small" id="btn-cheatsheet">常用模式 ▼</button></span>
      </div>
      <div style="padding:12px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span style="color:var(--muted)">/</span>
          <input id="in-pattern" class="field" style="flex:1;min-width:200px;font-family:ui-monospace,monospace" placeholder="输入正则，如 (\d{4})-(\d{2})-(\d{2})" spellcheck="false" />
          <span style="color:var(--muted)">/</span>
          <label title="全局匹配"><input type="checkbox" id="f-g" checked /> g</label>
          <label title="忽略大小写"><input type="checkbox" id="f-i" /> i</label>
          <label title="多行模式"><input type="checkbox" id="f-m" /> m</label>
          <label title="点号匹配换行"><input type="checkbox" id="f-s" /> s</label>
          <label title="Unicode 模式"><input type="checkbox" id="f-u" /> u</label>
        </div>
        <div id="cheatsheet" class="result-box" hidden></div>
        <div id="alert" class="alert"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input id="in-replace" class="field" style="flex:1;min-width:200px" placeholder="替换为（支持 $1 $2 $& 等），留空则只测试匹配" spellcheck="false" />
          <button class="btn small primary" id="btn-replace">应用替换 →</button>
        </div>
      </div>
    </section>

    <div class="workarea">
      <section class="pane">
        <div class="pane-header"><span class="pane-title">测试文本</span>
          <span class="actions">
            <button class="btn small" id="btn-sample">示例</button>
            <button class="btn small" id="btn-clear">清空</button>
          </span>
        </div>
        <textarea id="ta-src" class="tall" placeholder="在此粘贴要测试的文本…" spellcheck="false"></textarea>
      </section>
      <section class="pane">
        <div class="pane-header"><span class="pane-title">匹配高亮</span>
          <span class="actions"><button class="btn small" id="btn-copy-repl">复制替换结果</button></span>
        </div>
        <div class="output-wrap"><div id="hl-view" class="hl-view">匹配结果将高亮显示在这里…</div></div>
      </section>
    </div>

    <div class="statusbar">
      <span class="st-item">匹配数&nbsp;<b id="st-count">0</b></span>
      <span class="st-item">耗时&nbsp;<b id="st-time">-</b></span>
      <span class="st-item">状态&nbsp;<b id="st-status">待输入</b></span>
    </div>

    <section class="pane" style="margin-bottom:12px">
      <div class="pane-header"><span class="pane-title">匹配明细<em class="pane-sub">含捕获组</em></span></div>
      <div style="padding:12px">
        <table class="kv-table"><thead><tr><th style="width:56px">#</th><th>匹配文本</th><th style="width:90px">位置</th><th>捕获组</th></tr></thead>
        <tbody id="match-body"><tr><td colspan="4" style="color:var(--muted)">暂无匹配</td></tr></tbody></table>
      </div>
    </section>

    <section class="pane" style="margin-bottom:40px">
      <div class="pane-header"><span class="pane-title">替换结果预览</span></div>
      <div id="repl-view" class="result-box" style="margin:12px">在上方输入“替换为”并点「应用替换」，或开启实时替换。</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><a href="../index.html">← 返回工具箱首页</a> · WebTools · 全本地运行</div>
  </footer>

  <script>
    (function(){var tg=document.getElementById('theme-toggle');if(tg)tg.addEventListener('click',function(){var d=document.documentElement;var dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;try{localStorage.setItem('webtools.theme',dark?'dark':'light');}catch(e){}})})();
  </script>
  <script src="../assets/js/regex.js"></script>
</body>
</html>
