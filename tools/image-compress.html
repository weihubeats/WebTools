<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片压缩 · WebTools</title>
  <meta name="description" content="免费在线图片压缩：canvas 本地缩放与质量调节，JPEG/WebP/PNG 互转，全本地运行。" />
  <script>try{var _t=localStorage.getItem('webtools.theme');if(_t==='dark'||(!_t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(_e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/common.css?v=20260925a" />
  <link rel="stylesheet" href="../assets/css/nav.css?v=20260925a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>" />
</head>
<body>
    <!-- ============ 顶部导航（site-nav.js 渲染） ============ -->
  <div id="site-nav"></div>
  <script src="../assets/js/site-nav.js?v=20260925a"></script>

  <main class="container">
    <div class="page-title">
      <div class="title-row">
        <span class="title-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        </span>
        <h1>图片压缩</h1>
        <span class="badge-secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          全本地解析，不上传服务器
        </span>
      </div>
      <p>浏览器 canvas 本地压缩：限宽高缩放、质量调节、格式转换。</p>
    </div>

    <section class="pane" style="margin:12px 0">
      <div class="pane-header"><span class="pane-title">选择图片<em class="pane-sub">点击或拖拽到下方虚线框，支持 jpg / png / webp / gif 首帧</em></span>
        <span class="actions">
          <button class="btn small primary" id="btn-file">选择图片</button>
          <input type="file" id="file-input" accept="image/*" hidden />
        </span>
      </div>
      <div id="dropzone" class="dropzone">把图片拖到这里，或点右上「选择图片」</div>
    </section>

    <div class="toolbar" role="toolbar" aria-label="图片压缩操作">
      <div class="tb-group" role="group" aria-label="压缩设置">
        <label class="indent-label" for="in-maxw">最大宽 <input type="number" id="in-maxw" value="1600" min="16" max="8000" style="width:80px" /> px</label>
        <label class="indent-label" for="in-maxh">最大高 <input type="number" id="in-maxh" value="1600" min="16" max="8000" style="width:80px" /> px</label>
        <label class="indent-label" for="in-q">质量 <input type="range" id="in-q" min="10" max="100" value="80" style="vertical-align:middle" /> <b id="q-val">80%</b></label>
        <label class="indent-label" for="sel-fmt">格式
          <select id="sel-fmt">
            <option value="auto" selected>保持原格式</option>
            <option value="image/jpeg">JPEG（小，适合照片）</option>
            <option value="image/webp">WebP（更小，需浏览器支持）</option>
            <option value="image/png">PNG（无损，适合截图/透明）</option>
          </select>
        </label>
      </div>
      <span class="spacer"></span>
      <div class="tb-group" role="group" aria-label="核心动作">
        <button class="btn primary" id="btn-compress" disabled>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          压缩
        </button>
        <button class="btn" id="btn-download" disabled>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载结果
        </button>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="workarea">
      <section class="pane">
        <div class="pane-header"><span class="pane-title">原图</span><span class="drop-hint" id="info-src">-</span></div>
        <div style="padding:12px;text-align:center"><img id="img-src" class="cmp-img" alt="原图预览" /></div>
      </section>
      <section class="pane">
        <div class="pane-header"><span class="pane-title">压缩后</span><span class="drop-hint" id="info-dst">-</span></div>
        <div style="padding:12px;text-align:center"><img id="img-dst" class="cmp-img" alt="压缩结果预览" /></div>
      </section>
    </div>

    <div class="statusbar" style="margin-bottom:40px">
      <span class="st-item">原图&nbsp;<b id="st-src">-</b></span>
      <span class="st-item">压缩后&nbsp;<b id="st-dst">-</b></span>
      <span class="st-item">压缩率&nbsp;<b id="st-ratio">-</b></span>
      <span class="st-item">尺寸&nbsp;<b id="st-dim">-</b></span>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><a href="../index.html">← 返回工具箱首页</a> · WebTools · 全本地运行</div>
  </footer>

  <script>
    (function(){var tg=document.getElementById('theme-toggle');if(tg)tg.addEventListener('click',function(){var d=document.documentElement;var dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;try{localStorage.setItem('webtools.theme',dark?'dark':'light');}catch(e){}})})();
  </script>
  <script src="../assets/js/image-compress.js"></script>
</body>
</html>
