<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文本对比 · WebTools</title>
  <meta name="description" content="免费在线文本对比：行级 diff 高亮、忽略空白/大小写可选、统计与结果复制，全本地运行。" />
  <script>try{var _t=localStorage.getItem('webtools.theme');if(_t==='dark'||(!_t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(_e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/common.css?v=20260925a" />
  <link rel="stylesheet" href="../assets/css/nav.css?v=20260925a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
</head>
<body>
    <!-- ============ 顶部导航（site-nav.js 渲染） ============ -->
  <div id="site-nav"></div>
  <script src="../assets/js/site-nav.js?v=20260925a"></script>

  <main class="container">
    <div class="page-title">
      <div class="title-row">
        <span class="title-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>
        </span>
        <h1>文本对比（Diff）</h1>
        <span class="badge-secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          全本地解析，不上传服务器
        </span>
      </div>
      <p>行级对比、增删高亮、忽略空白 / 大小写可选，适合对比配置、文案、代码片段。</p>
    </div>

    <div class="toolbar" role="toolbar" aria-label="文本对比操作">
      <div class="tb-group" role="group" aria-label="核心动作">
        <button class="btn primary" id="btn-diff">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          开始对比
        </button>
      </div>
      <div class="tb-divider" aria-hidden="true"></div>
      <div class="tb-group" role="group" aria-label="对比选项">
        <label class="indent-label"><input type="checkbox" id="chk-ws" /> 忽略行首尾空白</label>
        <label class="indent-label"><input type="checkbox" id="chk-case" /> 忽略大小写</label>
        <label class="indent-label"><input type="checkbox" id="chk-live" checked /> 实时对比</label>
      </div>
      <span class="spacer"></span>
      <div class="tb-group" role="group" aria-label="辅助动作">
        <button class="btn ghost" id="btn-sample">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
          示例
        </button>
        <button class="btn ghost" id="btn-swap">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
          互换
        </button>
        <button class="btn ghost danger" id="btn-clear">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空
        </button>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="workarea">
      <section class="pane">
        <div class="pane-header"><span class="pane-title">原文 A</span>
          <span class="actions"><button class="btn small" id="btn-paste-a">粘贴</button></span>
        </div>
        <textarea id="ta-a" class="tall" placeholder="粘贴第一份文本…" spellcheck="false"></textarea>
      </section>
      <section class="pane">
        <div class="pane-header"><span class="pane-title">原文 B</span>
          <span class="actions"><button class="btn small" id="btn-paste-b">粘贴</button></span>
        </div>
        <textarea id="ta-b" class="tall" placeholder="粘贴第二份文本…" spellcheck="false"></textarea>
      </section>
    </div>

    <div class="statusbar">
      <span class="st-item">结果&nbsp;<b id="st-status">待对比</b></span>
      <span class="st-item">相同&nbsp;<b id="st-eq">-</b>&nbsp;行</span>
      <span class="st-item">删除&nbsp;<b id="st-del">-</b>&nbsp;行</span>
      <span class="st-item">新增&nbsp;<b id="st-add">-</b>&nbsp;行</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn small" id="btn-copy">复制 diff 文本</button>
    </div>

    <section class="pane" style="margin-bottom:40px">
      <div class="pane-header"><span class="pane-title">对比结果<em class="pane-sub">- 删除 / + 新增</em></span></div>
      <div id="diff-view" class="diff-view">对比结果将显示在这里…</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><a href="../index.html">← 返回工具箱首页</a> · WebTools · 全本地运行</div>
  </footer>

  <script>
    (function(){var tg=document.getElementById('theme-toggle');if(tg)tg.addEventListener('click',function(){var d=document.documentElement;var dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;try{localStorage.setItem('webtools.theme',dark?'dark':'light');}catch(e){}})})();
  </script>
  <script src="../assets/js/text-diff.js"></script>
</body>
</html>
