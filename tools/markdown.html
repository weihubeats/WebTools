<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown 预览 · WebTools</title>
  <meta name="description" content="免费在线 Markdown 预览：实时渲染、常用语法全支持、可复制导出 HTML，全本地运行。" />
  <script>try{var _t=localStorage.getItem('webtools.theme');if(_t==='dark'||(!_t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(_e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/common.css?v=20260908d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">🧰 Web<span>Tools</span></a>
      <div class="nav-wrap">
      <nav class="nav">
        <a href="../index.html">首页</a>
        <a href="./json-formatter.html">JSON</a>
        <a href="./base64.html">Base64</a>
        <a href="./timestamp.html">时间戳</a>
        <a href="./url-codec.html">URL</a>
        <a href="./regex.html">正则</a>
        <a href="./jwt.html">JWT</a>
        <a href="./text-diff.html">对比</a>
        <a href="./password.html">密码</a>
        <a href="./markdown.html" class="active">MD</a>
        <a href="./image-compress.html">图片</a>
      </nav>
        <button class="icon-btn theme-btn" id="theme-toggle" title="切换深色 / 浅色" aria-label="切换深色模式">
          <svg class="ic icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="ic icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <div class="title-row">
        <span class="title-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
        </span>
        <h1>Markdown 预览</h1>
        <span class="badge-secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          全本地解析，不上传服务器
        </span>
      </div>
      <p>标题 / 加粗 / 列表 / 代码块 / 表格 / 引用实时渲染，可复制导出 HTML。</p>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Markdown 操作">
      <div class="tb-group" role="group" aria-label="辅助动作">
        <button class="btn ghost" id="btn-sample">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
          示例
        </button>
        <button class="btn ghost danger" id="btn-clear">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空
        </button>
      </div>
      <span class="spacer"></span>
      <div class="tb-group" role="group" aria-label="导出动作">
        <button class="btn" id="btn-copy-html">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制 HTML
        </button>
        <button class="btn primary" id="btn-download">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载 .html
        </button>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div class="workarea">
      <section class="pane">
        <div class="pane-header"><span class="pane-title">Markdown 源码</span><span class="drop-hint" id="st-count">0 字符</span></div>
        <textarea id="ta-md" class="tall" style="min-height:480px" placeholder="在此输入 Markdown…" spellcheck="false"></textarea>
      </section>
      <section class="pane">
        <div class="pane-header"><span class="pane-title">预览</span></div>
        <div class="output-wrap"><article id="md-view" class="md-view"></article></div>
      </section>
    </div>

    <p class="page-note">
      说明：内置手写轻量解析器（无第三方依赖），支持标题、加粗、斜体、删除线、行内代码、代码块、链接、图片、无序/有序列表、引用、分割线、表格。
      复杂扩展语法（脚注、数学公式、Mermaid）不在支持范围。
    </p>
  </main>

  <footer class="site-footer">
    <div class="container"><a href="../index.html">← 返回工具箱首页</a> · WebTools · 全本地运行</div>
  </footer>

  <script>
    (function(){var tg=document.getElementById('theme-toggle');if(tg)tg.addEventListener('click',function(){var d=document.documentElement;var dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;try{localStorage.setItem('webtools.theme',dark?'dark':'light');}catch(e){}})})();
  </script>
  <script src="../assets/js/markdown.js"></script>
</body>
</html>
