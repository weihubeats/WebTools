<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown 预览 · WebTools</title>
  <meta name="description" content="免费在线 Markdown 预览：实时渲染、常用语法全支持、可复制导出 HTML，全本地运行。" />
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">🧰 Web<span>Tools</span></a>
      <nav class="nav">
        <a href="../index.html">首页</a>
        <a href="./json-formatter.html">JSON</a>
        <a href="./base64.html">Base64</a>
        <a href="./timestamp.html">时间戳</a>
        <a href="./url-codec.html">URL</a>
        <a href="./regex.html">正则</a>
        <a href="./jwt.html">JWT</a>
        <a href="./text-diff.html">对比</a>
        <a href="./password.html">密码</a>
        <a href="./markdown.html" class="active">MD</a>
        <a href="./image-compress.html">图片</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <h1>📄 Markdown 预览</h1>
      <p>标题 / 加粗 / 列表 / 代码块 / 表格 / 引用实时渲染，可复制导出 HTML，全本地运行。</p>
    </div>

    <div class="toolbar">
      <button class="btn" id="btn-sample">示例</button>
      <button class="btn" id="btn-clear">清空</button>
      <span class="spacer"></span>
      <button class="btn" id="btn-copy-html">复制 HTML</button>
      <button class="btn" id="btn-download">下载 .html</button>
    </div>

    <div id="alert" class="alert"></div>

    <div class="workarea">
      <section class="pane">
        <div class="pane-header"><span>Markdown 源码</span><span class="drop-hint" id="st-count">0 字符</span></div>
        <textarea id="ta-md" class="tall" style="min-height:480px" placeholder="在此输入 Markdown…" spellcheck="false"></textarea>
      </section>
      <section class="pane">
        <div class="pane-header"><span>预览</span></div>
        <div class="output-wrap"><article id="md-view" class="md-view"></article></div>
      </section>
    </div>

    <p style="color:var(--muted);font-size:13px;margin:0 0 40px">
      说明：内置手写轻量解析器（无第三方依赖），支持标题、加粗、斜体、删除线、行内代码、代码块、链接、图片、无序/有序列表、引用、分割线、表格。
      复杂扩展语法（脚注、数学公式、Mermaid）不在支持范围。
    </p>
  </main>

  <footer class="site-footer">
    <div class="container"><a href="../index.html">← 返回工具箱首页</a> · WebTools · 全本地运行</div>
  </footer>

  <script src="../assets/js/markdown.js"></script>
</body>
</html>
